name: Build JARVIS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: unzip -o JARVIS_ANDROID_SOURCE.zip -d .

      - name: Crear Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-MAXIMUM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
